<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="تحميل وثائق الرؤية الاستراتيجية 2030">
  <title>تحميل الوثائق</title>
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/download-options.css">

<body class="download-page">
  <main class="download-shell">
    <p class="eyebrow">بلدية طرابلس المركز</p>
    <p class="download-intro">اختر الوثيقة التي تود تحميلها.</p>
    <section class="document-list" aria-label="ملفات التحميل">
      <div class="document-option">
        <span class="document-number">01</span>
        <h2>الرؤية الاستراتيجية 2030 - عربي</h2>
        <p class="help">نسخة الوثيقة باللغة العربية.</p>
        <a id="manual-download" class="button primary" href="documents/vision-2030.pdf" download="vision-2030.pdf">تحميل PDF</a>
      </div>
      <div class="document-option" lang="en" dir="ltr">
        <span class="document-number">02</span>
        <h2>Vision 2030 - English</h2>
        <p class="help">English version of the strategic vision document.</p>
        <a id="manual-projects-download" class="button secondary" href="documents/vision-2030-projects.pdf" download="vision-2030-projects.pdf">Download PDF</a>
      </div>
    </section>
  </main>
